version: "3.8"

# docker-compose.yml
# -------------------
# Local development setup: Kafka + Zookeeper
# Usage: docker-compose up -d

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - SPARK_MODE=master
      - AWS_PROFILE=default
      - AWS_CONFIG_FILE=/home/spark/.aws/config
      - AWS_SHARED_CREDENTIALS_FILE=/home/spark/.aws/credentials
      - HOME=/home/spark
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - ./consumer:/opt/bitnami/spark/consumer
      - ./config:/opt/bitnami/spark/config
      - ./storage:/opt/bitnami/spark/storage
      - ./dq:/opt/bitnami/spark/dq
      - ./producer:/opt/bitnami/spark/producer
      - ${USERPROFILE}/.aws:/home/spark/.aws:ro